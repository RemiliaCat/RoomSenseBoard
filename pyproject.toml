[project]
name = "roomsenseboard"
version = "0.3.1"
description = "RoomSenseBoard 室内环境感知与监控系统"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# 运行时只用标准库，没有第三方依赖。
dependencies = []

[tool.uv]
# 直接运行，不作为 Python 包安装。
package = false

[dependency-groups]
# 仅打包发布需要，运行时零依赖；安装：uv sync。
dev = [
    "pyinstaller>=6.0",
]
